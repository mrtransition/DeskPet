name: 功能建议
description: 按需求准入检查清单提交功能建议，先判断是否值得做
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。DeskPet 的核心目的是**轻量、私密、点击即聊的桌面 AI 聊天宠物**。
        请先回答下面六个问题；任一问题回答不明确时，维护者会暂缓或降级为评估事项。
        完整规则见 [需求准入检查清单](https://github.com/mrtransition/DeskPet/blob/main/docs/%E6%B2%BB%E7%90%86/%E9%9C%80%E6%B1%82%E5%87%86%E5%85%A5%E6%A3%80%E6%9F%A5%E6%B8%85%E5%8D%95.md)。

  - type: textarea
    id: summary
    attributes:
      label: 需求摘要
      description: 一句话说明你想解决什么问题，而不是先描述实现方案。
      placeholder: 我在……场景下遇到……问题，希望……
    validations:
      required: true

  - type: textarea
    id: core
    attributes:
      label: Q1 核心相关性
      description: 它如何让“点击即聊”更快、更稳、更可信或更有陪伴感？请写出用户操作路径。
      placeholder: 用户路径：点击宠物 → ……；与现有能力的差异：……
    validations:
      required: true

  - type: dropdown
    id: default
    attributes:
      label: Q2 默认值
      description: 新能力应默认关闭，除非它是核心链路的直接组成部分。
      options:
        - 默认关闭 / 归入实验性增强
        - 默认开启，且属于核心链路（需说明关闭路径）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: attack-surface
    attributes:
      label: Q3 攻击面
      description: 是否新增系统权限、读取敏感数据、出站请求或解析外部文件？如扩大，是否愿意配合安全评审？
      placeholder: 无新增 / 新增……；数据流向：……；是否可撤销：……
    validations:
      required: true

  - type: textarea
    id: revoke
    attributes:
      label: Q4 可撤销性
      description: 用户在哪里关闭？关闭后是否仍有后台行为？
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Q5 体积与依赖
      description: 是否引入新依赖、原生库或明显代码量？有无更轻的替代方案？
    validations:
      required: true

  - type: textarea
    id: synergy
    attributes:
      label: Q6 协同关系
      description: 复用哪些现有数据 / 人格 / 皮肤 / 提醒 / 工具？是否合并入口而不是新增入口？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过但不采用的做法，以及原因。
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 确认
      options:
        - label: 我理解偏离核心且默认开启的功能会被要求改为默认关闭或拒绝。
          required: true
        - label: 我理解新增工具 / 感知源 / 系统集成点需要先完成安全评审。
          required: true
