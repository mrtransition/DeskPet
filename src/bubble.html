<!DOCTYPE html>
<html lang="zh-CN" data-win="bubble">
<head>
<meta charset="UTF-8">
<title>DeskPet Bubble</title>
<link rel="stylesheet" href="shared.css">
<style>
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { display: flex; flex-direction: column; }
#card {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: rgba(255,255,255,.96);
  border: 1px solid rgba(255,255,255,.98);
  outline: 1px solid rgba(84,155,251,.10);
  border-radius: var(--r-xl);
  box-shadow: 0 12px 40px rgba(31,39,51,.20);
  overflow: hidden;
  position: relative;
}
/* FR-BUB-003：左右边缘拖拽调整宽度（240–480 px） */
.b-resize { position: absolute; top: 18px; bottom: 18px; width: 7px; cursor: ew-resize; z-index: 6; }
.b-resize:hover, .b-resize.drag { background: rgba(84,155,251,.28); }
.b-resize.left { left: 0; border-radius: 4px 0 0 4px; }
.b-resize.right { right: 0; border-radius: 0 4px 4px 0; }
#card .bt { position: absolute; width: 12px; height: 12px; background: rgba(255,255,255,.96); display: none; }
#card:not(.below) .bt-down { display: block; bottom: -6.5px; left: calc(50% - 6px); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
#card.below .bt-up { display: block; top: -6.5px; left: calc(50% - 6px); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.b-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
.b-avatar { width: 26px; height: 26px; border-radius: var(--r); background: var(--primary-bg); border: 1px solid var(--primary-line); display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
.b-name { font-weight: 600; font-size: var(--fs); color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.b-head .ib { width: 24px; height: 24px; padding: 0; border: none; background: transparent; color: var(--t3); font-size: 13px; border-radius: var(--r-sm); flex: none; display: flex; align-items: center; justify-content: center; }
.b-head .ib:hover { background: var(--primary-bg); color: var(--primary); }
.b-msgs { flex: 1; min-height: 48px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.b-think { display: none; align-self: flex-start; background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 8px 12px; color: var(--t2); font-size: var(--fs); align-items: center; gap: 8px; margin: 0 10px; flex: none; }
.b-think.show { display: flex; }
.b-quick { display: flex; flex-wrap: wrap; gap: 4px; padding: 7px 10px 0; flex: none; }
.b-quick:empty { display: none; }
.chip { border: 1px solid var(--line-dk); background: #fff; color: var(--t2); border-radius: 999px; padding: 3px 10px; font-size: var(--fs-xs); }
.chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
.b-input { display: flex; align-items: flex-end; gap: 6px; padding: 9px 10px 6px; flex: none; }
.b-input textarea { flex: 1; resize: none; border: 1px solid var(--line-dk); border-radius: var(--r-lg); padding: 7px 10px; font-size: var(--fs); line-height: 1.5; min-height: 34px; max-height: 86px; background: rgba(255,255,255,.9); }
.b-send { width: 34px; height: 34px; flex: none; border-radius: 50%; padding: 0; font-size: 14px; display: flex; align-items: center; justify-content: center; border: none; }
.b-send.stop { background: #fff; border: 1px solid #F0C7C7; color: var(--err); }
.msg.tool { font-size: var(--fs-xs); color: var(--t2); }
.msg.tool.ok { border-left: 3px solid var(--ok, #4CAF7D); }
.msg.tool.warn { border-left: 3px solid #E8A33D; }
.msg.tool .tool-desc { margin-top: 3px; color: var(--t2); }
.msg.tool .tool-args { margin-top: 4px; font-family: monospace; font-size: 10px; color: var(--t3); word-break: break-all; max-height: 60px; overflow: auto; }
.b-hint { padding: 0 10px 8px; font-size: 10px; color: var(--t3); display: flex; justify-content: space-between; flex: none; }
</style>
</head>
<body>
<div id="card">
  <div class="bt bt-down"></div><div class="bt bt-up"></div>
  <div class="b-resize left" data-side="left" title="拖拽调整气泡宽度"></div>
  <div class="b-resize right" data-side="right" title="拖拽调整气泡宽度"></div>
  <div class="b-head">
    <div class="b-avatar" id="bAvatar">🐱</div>
    <span class="b-name" id="bName">团子</span>
    <button class="ib" id="bSwitch" title="快速切换模型 / 人格">⚡</button>
    <button class="ib" id="bNew" title="新会话">＋</button>
    <button class="ib" id="bSettings" title="设置">⚙</button>
    <button class="ib" id="bClose" title="关闭 (Esc)">✕</button>
  </div>
  <div class="b-msgs" id="bMsgs"></div>
  <div class="b-think" id="bThink"><span class="tdots"><i></i><i></i><i></i></span><span id="bThinkText" data-i18n="bubble.thinking">思考中…</span></div>
  <div class="b-quick" id="bQuick"></div>
  <div class="b-input">
    <textarea id="bInput" rows="1" placeholder="说点什么…（记住：… / N 分钟后提醒我…）" data-i18n-ph="bubble.placeholder"></textarea>
    <button class="b-send primary" id="bSend" title="发送" data-i18n-title="bubble.send">➤</button>
  </div>
  <div class="b-hint"><span id="bHintL" data-i18n="bubble.hint">Enter 发送 · Shift+Enter 换行 · Esc 关闭</span><span id="bHintR"></span></div>
</div>

<script src="shared.js"></script>
<script src="i18n.js"></script>
<script>
'use strict';
const card = $id('card');
const bMsgs = $id('bMsgs');
const bInput = $id('bInput');
let streaming = false;
let mockHintShown = false;
let liveBuf = '';
let liveEl = null;
let lastBubbleAct = Date.now();
let lastFitH = 0;
let fitTimer = null;
let cooldownUntil = 0;
let cdTimer = null;
// 本次气泡是否由后端「提醒」自动弹出：是的话，确认提醒后直接把气泡关掉，
// 否则用户会觉得点了「知道了」窗口还挂着（v0.2.7 仅移除了消息，窗口仍在）。
let openedByReminder = false;

/* ---- 高度自适应（FR-BUB-003） ---- */
function fitHeight() {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    try {
      const fixed = card.offsetHeight - bMsgs.offsetHeight;
      const need = Math.min(bMsgs.scrollHeight, 240);
      const h = Math.min(360, Math.max(150, fixed + need + 4));
      if (Math.abs(h - lastFitH) > 6) {
        lastFitH = h;
        invoke('bubble_resize', { height: h });
      }
    } catch (e) { }
  }, 180);
}
function scrollMsgs(force) {
  const nearBottom = bMsgs.scrollHeight - bMsgs.scrollTop - bMsgs.clientHeight < 60;
  if (nearBottom || force) bMsgs.scrollTop = bMsgs.scrollHeight;
}

/* ---- 消息渲染 ---- */
function makeMsgEl(m) {
  let d;
  if (m.role === 'user') {
    d = el('div', 'msg user', esc(m.content));
  } else if (m.role === 'assistant') {
    d = el('div', 'msg ai');
    d.innerHTML = '<div class="md">' + md(m.content) + '</div>';
    const cp = el('button', 'm-copy', t('common.copy'));
    cp.onclick = () => copyText(m.content);
    d.appendChild(cp);
    // FR-VOI-001：逐条朗读（TTS），与自动朗读共用系统语音设置
    const sp = el('button', 'm-copy m-speak', '🔊');
    sp.title = t('bubble.speak');
    sp.onclick = () => speakText(m.content);
    d.appendChild(sp);
  } else if (m.role === 'error') {
    d = el('div', 'msg err');
    d.innerHTML = '<b>⚠ ' + esc(m.title || '请求失败') + '</b>' + (m.content ? '<div style="margin-top:3px">' + esc(m.content) + '</div>' : '') +
      '<div class="m-act"><button data-act="retry">' + t('bubble.retry') + '</button><button data-act="switch">' + t('bubble.switchModel') + '</button><button data-act="settings">' + t('bubble.openSettings') + '</button></div>';
  } else {
    d = el('div', 'msg sys' + (m.warn ? ' warn' : ''), esc(m.content));
    if (m.reminder) d.dataset.reminder = '1';
    if (m.actions) {
      const act = el('div', 'm-act');
      m.actions.forEach(a => {
        const b = el('button', '', esc(a.label));
        b.onclick = () => {
          try { a.onClick && a.onClick(); }
          finally {
            if (a.dismiss) {
              d.remove();
              scrollMsgs(false);
              fitHeight();
              // 提醒由后端自动弹出时，处理完就收起气泡；若还有其它提醒未确认则保留
              if (a.closeBubble && openedByReminder && !bMsgs.querySelector('[data-reminder]')) {
                openedByReminder = false;
                invoke('hide_bubble_cmd');
              }
            }
          }
        };
        act.appendChild(b);
      });
      d.appendChild(act);
      d.style.textAlign = 'left';
    }
  }
  return d;
}
function appendMsg(m) { bMsgs.appendChild(makeMsgEl(m)); scrollMsgs(true); fitHeight(); }
bMsgs.addEventListener('click', e => {
  const cp = e.target.closest('.cb-copy');
  if (cp) { const code = cp.closest('.codeblock').querySelector('code'); copyText(code.textContent); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'retry') { if (!streaming) generate(); }
  else if (btn.dataset.act === 'switch') { $id('bSwitch').click(); }
  else if (btn.dataset.act === 'settings') invoke('open_settings_cmd');
});
/* 临时卡片（工具执行中 / 授权询问 / 系统提示）不写入会话历史。
   授权期间主进程会弹出气泡并触发一次重渲染，若与持久消息同容器重建，卡片会被抹掉，
   用户永远看不到授权入口、只能等到超时——因此单列容器，重渲染时不受影响。 */
function tempHost() {
  let h = $id('bTemp');
  if (!h) {
    h = el('div');
    h.id = 'bTemp';
    h.style.display = 'contents';
    bMsgs.appendChild(h);
  }
  return h;
}
function renderSessionMsgs() {
  [...bMsgs.children].forEach(n => { if (n.id !== 'bTemp') n.remove(); });
  const s = curSession();
  if (s) s.msgs.forEach(m => { if (m && m.role) bMsgs.insertBefore(makeMsgEl(m), $id('bTemp')); });
  if ($id('bTemp')) bMsgs.appendChild($id('bTemp'));
  scrollMsgs(true);
  fitHeight();
}
function pushSys(content, opts) {
  const s = curSession();
  const m = { role: 'system', content, ts: Date.now(), warn: opts && opts.warn };
  if (opts && opts.actions) m.actions = opts.actions;
  if (opts && opts.reminder) m.reminder = true;
  if (opts && opts.ephemeral) { appendMsg(m); return; }
  if (s) { s.msgs.push(m); s.updatedAt = Date.now(); saveState(); }
  appendMsg(m);
}

/* ---- FR-VOI-001：TTS 朗读 ----
   使用 WebView2 内置的 SpeechSynthesis（系统语音包），不产生任何网络请求；
   语音输入（ASR）不在本轮范围，设置页会明确标注。 */
function ttsReady() { return typeof window !== 'undefined' && 'speechSynthesis' in window; }
function pickVoice() {
  if (!ttsReady()) return null;
  const voices = speechSynthesis.getVoices() || [];
  if (!voices.length) return null;
  const want = (S && S.settings && S.settings.voiceURI) || '';
  return voices.find(v => v.voiceURI === want) ||
    voices.find(v => /^zh/i.test(v.lang)) ||
    voices[0];
}
function plainForSpeech(text) {
  return String(text || '')
    .replace(/```[\s\S]*?```/g, '（代码块）')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/[#>*_~]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function speakText(text) {
  if (!ttsReady()) { toast(t('bubble.ttsUnsupported'), 'warn'); return; }
  const plain = plainForSpeech(text);
  if (!plain) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain.slice(0, 800));
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate = Math.max(0.5, Math.min(2, parseFloat(S.settings.voiceRate) || 1));
    u.lang = v ? v.lang : (S.settings.lang === 'en' ? 'en-US' : 'zh-CN');
    speechSynthesis.speak(u);
  } catch (e) { toast(t('bubble.ttsFailed') + e, 'err'); }
}
function stopSpeak() { try { if (ttsReady()) speechSynthesis.cancel(); } catch (e) { } }

/* ---- 头部 / 快捷动作 ---- */
function renderHead() {
  const p = activePers(), pv = activeProv();
  $id('bAvatar').textContent = p ? (p.avatar || '🐱') : '🐱';
  const nameEl = $id('bName');
  nameEl.textContent = p ? p.name : '宠物';
  nameEl.title = p ? (p.name + (p.systemPrompt ? ' · ' + cut(p.systemPrompt, 50) : '')) : '';
  const box = $id('bQuick');
  box.innerHTML = '';
  if (p && p.quickActions) {
    p.quickActions.slice(0, 5).forEach(qa => {
      const c = el('button', 'chip', esc(qa.label));
      c.title = qa.prompt;
      c.onclick = () => { if (!streaming) send(qa.prompt); };
      box.appendChild(c);
    });
  }
  $id('bHintR').textContent = pv ? (pv.type === 'mock' ? '演示模式' : pv.model + ' @ ' + pv.name) : '';
  fitHeight();
}
function openSwitchMenu(x, y) {
  const s = curSession();
  const curId = (activeProv() || {}).id;
  const items = [];
  S.providers.forEach(pr => items.push({
    icon: '🤖', label: pr.name + (pr.model && pr.type !== 'mock' ? ' · ' + pr.model : ''),
    check: curId === pr.id,
    onClick: async () => {
      // 立即写盘，避免防抖窗口内关窗丢失选择（之后又回到演示模式）
      await setSessionProvider(pr.id);
      renderHead();
    },
  }));
  items.push('-');
  S.personas.forEach(ps => items.push({
    icon: ps.avatar || '🐱', label: ps.name, check: s ? s.personaId === ps.id : false,
    onClick: () => {
      // FR-PSN-005：人格切换同时应用其绑定的供应商与皮肤
      switchPersona(ps.id);
      saveState();
      renderHead();
      if (!streaming) renderSessionMsgs();
    },
  }));
  showMenu(items, x, y);
}
$id('bSwitch').addEventListener('click', e => {
  e.stopPropagation();
  const r = e.target.getBoundingClientRect();
  openSwitchMenu(Math.max(8, r.left - 150), r.bottom + 6);
});
$id('bNew').addEventListener('click', () => { newSession(); toast('已开启新会话', 'ok'); });
$id('bSettings').addEventListener('click', () => invoke('open_settings_cmd'));
$id('bClose').addEventListener('click', () => { stopSpeak(); invoke('hide_bubble_cmd'); });

/* ---- 会话 ---- */
function newSession() {
  stopSpeak();
  const pers = activePers();
  // 新会话优先使用人格绑定的供应商（FR-PSN-002/FR-MDL-006），其次才是默认供应商
  const prov = (pers && getProv(pers.providerId)) || activeProv();
  const s = {
    id: uid('s'), personaId: pers ? pers.id : 'ps-1', providerId: prov ? prov.id : 'p-demo',
    title: '', createdAt: Date.now(), updatedAt: Date.now(), msgs: [],
  };
  if (pers && pers.greeting) s.msgs.push({ role: 'assistant', content: pers.greeting, ts: Date.now() });
  S.sessions.unshift(s);
  S.currentSessionId = s.id;
  saveState();
  renderHead();
  renderSessionMsgs();
  return s;
}

/* ---- 上下文构建（人格 + 记忆注入 + 轮数/token 双重截断） ---- */
function buildContext(s) {
  const pers = getPers(s.personaId);
  let sys = pers ? pers.systemPrompt : '';
  const lastUser = [...s.msgs].reverse().find(m => m.role === 'user');
  const mems = pickMemories(lastUser ? lastUser.content : '', pers);
  if (mems.length) sys += '\n\n[用户长期记忆]\n' + mems.map(m => '- ' + m.content).join('\n');
  // FR-MEM-003：模型生成的较早对话摘要作为上下文前缀，替代被压缩掉的消息
  if (s.summary) sys += '\n\n[较早对话摘要]\n' + s.summary;
  const params = (activeProv() && activeProv().params) || {};
  // summaryCount 是 s.msgs 的原始下标，只统计摘要点之后的消息，避免重复注入
  const rawStart = Math.min(Math.max(0, s.summaryCount || 0), s.msgs.length);
  const hist = s.msgs.slice(rawStart).filter(m => m.role === 'user' || m.role === 'assistant');
  const rounds = params.ctxRounds !== undefined ? params.ctxRounds : 10;
  let cutMsgs = rounds > 0 ? hist.slice(-rounds * 2) : hist.slice();
  const roundTrimmed = cutMsgs.length < hist.length;
  // FR-MDL-012：在轮数截断之后再按 ctxTokens 预算裁剪，为输出预留空间
  const maxTokens = Math.max(512, parseInt(params.ctxTokens, 10) || 8000);
  const reserve = Math.min(2048, Math.max(256, parseInt(params.maxTokens, 10) || 1024));
  const budget = Math.max(256, maxTokens - reserve);
  let tokenTrimmed = false;
  const total = () => estTokens(sys) + cutMsgs.reduce((n, m) => n + estTokens(m.content), 0);
  while (cutMsgs.length > 1 && total() > budget) {
    cutMsgs.shift();
    tokenTrimmed = true;
  }
  return {
    messages: [{ role: 'system', content: sys || '你是一个桌面宠物助手。' }, ...cutMsgs],
    trunc: roundTrimmed || tokenTrimmed,
    roundTrimmed,
    tokenTrimmed,
    rounds,
    tokens: total(),
    maxTokens,
  };
}

/* ---- FR-MEM-003：超长会话摘要压缩 ----
   触发条件：自上次摘要点之后的消息数超过 summaryThreshold 轮。
   保留最近 ctxRounds 轮原始消息，其余交给主进程调用模型压缩；
   摘要写入会话后，buildContext 只发送摘要 + 最近若干轮，旧消息不再重复占用上下文。 */
let summarizing = false;
async function ensureSummary(s, prov) {
  if (summarizing || !s || !prov || !s.msgs.length) return false;
  const th = Math.max(4, Math.min(100, parseInt(S.settings.summaryThreshold, 10) || 24));
  const rawStart = Math.min(Math.max(0, s.summaryCount || 0), s.msgs.length);
  const pending = s.msgs.slice(rawStart).filter(m => m.role === 'user' || m.role === 'assistant');
  if (pending.length <= th * 2) return false;
  const params = prov.params || {};
  const keepRounds = Math.max(2, Math.min(20, parseInt(params.ctxRounds, 10) || 10));
  // cut 对齐到用户消息边界，避免把一问一答拆到摘要两侧
  let cut = s.msgs.length - keepRounds * 2;
  if (cut <= rawStart) return false;
  while (cut > rawStart && s.msgs[cut] && s.msgs[cut].role !== 'user') cut--;
  if (cut <= rawStart) return false;
  const older = s.msgs.slice(rawStart, cut).filter(m => m.role === 'user' || m.role === 'assistant');
  if (older.length < 4) return false;
  const payload = [];
  if (s.summary) payload.push({ role: 'system', content: s.summary });
  older.forEach(m => payload.push({ role: m.role, content: m.content }));
  const en = S.settings.lang === 'en';
  summarizing = true;
  pushSys(en ? 'Compressing earlier messages…' : '正在把较早的对话压缩成摘要…', { ephemeral: true });
  try {
    const res = await invoke('chat_summarize', { providerId: prov.id, messages: payload });
    const text = res && res.summary ? String(res.summary).trim() : '';
    if (!text) return false;
    s.summary = text;
    s.summaryCount = cut;
    s.updatedAt = Date.now();
    saveState();
    pushSys((en ? 'Earlier messages summarized (' : '已将较早对话压缩为摘要（') + older.length + (en ? ' messages).' : ' 条消息）。'), { ephemeral: true });
    return true;
  } catch (e) {
    pushSys((en ? 'Summary failed, falling back to truncation: ' : '摘要生成失败，已回退到截断：') + e, { warn: true, ephemeral: true });
    return false;
  } finally {
    summarizing = false;
  }
}

/* ---- 发送与流式 ---- */
async function send(text) {
  stopSpeak();
  let s = curSession();
  if (!s) s = newSession();
  s.msgs.push({ role: 'user', content: text, ts: Date.now() });
  if (!s.title) s.title = cut(text, 16);
  s.updatedAt = Date.now();
  appendMsg({ role: 'user', content: text });
  saveState();
  sideEffects(text);
  await generate();
}
function sideEffects(text) {
  const t = String(text || '');
  const rm = t.match(/^记住[:：]?\s*(.{2,120})/);
  if (rm) {
    const content = rm[1].trim();
    S.memories.push({ id: uid('mem'), content, tags: inferMemoryTags(content), ts: Date.now() });
    saveState();
    pushSys('📝 已写入长期记忆：' + cut(content, 40) + '（每次对话自动注入）');
    // P-06：写入记忆时使用当前人格配置的反馈动画
    const pers = activePers();
    const fx = (pers && pers.animation && pers.animation.remember) || 'happy';
    tEmitTo('pet', 'reminder-fx', { kind: fx });
  }
  const rem = parseReminder(t);
  if (rem) {
    invoke('reminder_add', { reminder: rem });
    pushSys('⏰ 提醒已创建：' + rem.content + ' · ' + remRuleText(rem));
    tEmitTo('pet', 'reminder-fx', { kind: 'happy' });
  }
}
let preparing = false;
async function generate() {
  const s = curSession();
  if (!s || streaming || preparing) return;
  if (Date.now() < cooldownUntil) {
    toast('请求过于频繁，请 ' + Math.ceil((cooldownUntil - Date.now()) / 1000) + ' 秒后再试', 'warn');
    return;
  }
  let prov = activeProv();
  // 已配置真实供应商却仍解析到演示模式：先自动切到真实默认并落盘，不让用户在无提示下继续得到内置回复
  if (isMockProv(prov)) {
    const real = S.providers.find(p => p.type !== 'mock' && p.baseUrl);
    if (real) {
      await setSessionProvider(real.id);
      prov = getProv(real.id);
      renderHead();
      if (!mockHintShown) {
        mockHintShown = true;
        pushSys('已将本次对话切换到「' + real.name + '」，后续回复来自真实模型（可在 ⚡ 里改回演示模式）', { ephemeral: true });
      }
    }
  }
  // 会话绑定已失效（例如供应商被删除）时必须显式说明，不能让回复来源含糊
  const sess = curSession();
  if (sess && sess.providerId && sess.providerId !== prov.id) {
    sess.providerId = prov.id;
    saveState();
  }
  // FR-MEM-003：先压缩较早对话，再按摘要 + 最近轮次构建上下文
  preparing = true;
  try { await ensureSummary(s, prov); } catch (e) { }
  finally { preparing = false; }
  const { messages, roundTrimmed, tokenTrimmed, rounds, tokens, maxTokens } = buildContext(s);
  if (tokenTrimmed) pushSys('上下文已按 ' + maxTokens + ' tokens 预算裁剪（当前约 ' + tokens + ' tokens）', { warn: true, ephemeral: true });
  else if (roundTrimmed) pushSys('上下文已按最近 ' + rounds + ' 轮截断', { warn: true, ephemeral: true });
  streaming = true;
  liveBuf = '';
  liveEl = null;
  const sendBtn = $id('bSend');
  sendBtn.textContent = '■'; sendBtn.title = t('bubble.stop'); sendBtn.classList.add('stop');
  tEmitTo('pet', 'chat-state', { state: 'work' });
  const think = $id('bThink');
  $id('bThinkText').textContent = (S.settings.lang==='en'?'Thinking · ':'思考中 · ') + (prov.type === 'mock' ? '演示模式' : prov.model + ' @ ' + prov.name);
  think.classList.add('show');
  scrollMsgs(true); fitHeight();
  S.stats.requests = (S.stats.requests || 0) + 1;
  S.stats.tokensIn = (S.stats.tokensIn || 0) + messages.reduce((n, m) => n + estTokens(m.content), 0);
  saveState();
  try {
    await invoke('chat_start', { args: { providerId: prov.id, messages } });
  } catch (e) {
    finishStream(false, null, String(e));
  }
}
function onDelta(text) {
  const think = $id('bThink');
  if (think.classList.contains('show')) {
    think.classList.remove('show');
    tEmitTo('pet', 'chat-state', { state: 'talk' });
  }
  if (!liveEl) {
    liveEl = el('div', 'msg ai');
    liveEl.innerHTML = '<span class="m-text"></span><span class="m-cursor"></span>';
    bMsgs.appendChild(liveEl);
  }
  liveBuf += text;
  liveEl.querySelector('.m-text').textContent = liveBuf;
  touchBubbleAct();
  scrollMsgs(false);
  fitHeight();
}
/* ---- 429 冷却倒计时（FR-MDL-009）：遵循 Retry-After，期间禁止重发 ---- */
function startCooldown(secs) {
  const n = parseInt(secs, 10);
  if (!n || n <= 0) return;
  cooldownUntil = Date.now() + n * 1000;
  clearInterval(cdTimer);
  const node = el('div', 'msg sys warn');
  bMsgs.appendChild(node);
  const tick = () => {
    const left = Math.ceil((cooldownUntil - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(cdTimer);
      cooldownUntil = 0;
      node.remove();
      fitHeight();
      return;
    }
    node.textContent = '⏳ 请求过于频繁（429），请 ' + left + ' 秒后重试';
  };
  tick();
  cdTimer = setInterval(tick, 1000);
  scrollMsgs(true);
  fitHeight();
}
function finishStream(ok, errInfo, rawErr, opts) {
  const think = $id('bThink');
  think.classList.remove('show');
  const s = curSession();
  if (liveBuf) {
    if (s) {
      s.msgs.push({ role: 'assistant', content: liveBuf, ts: Date.now() });
      S.stats.tokensOut = (S.stats.tokensOut || 0) + estTokens(liveBuf);
    }
    if (liveEl) {
      const final = makeMsgEl({ role: 'assistant', content: liveBuf });
      liveEl.replaceWith(final);
    }
  } else if (liveEl) {
    liveEl.remove();
  }
  liveEl = null;
  if (!ok) {
    const info = errInfo || { status: null, message: rawErr || '未知错误' };
    if (s) s.msgs.push({ role: 'error', title: errTitle(info), content: info.message });
    appendMsg({ role: 'error', title: errTitle(info), content: info.message });
    if (info.retryAfter) startCooldown(info.retryAfter);
    tEmitTo('pet', 'chat-state', { state: 'error' });
  } else {
    tEmitTo('pet', 'chat-state', { state: 'idle' });
    // FR-VOI-001：自动朗读本次完整回复（用户手动停止时不朗读）
    if (liveBuf && S.settings.voice && !(opts && opts.noSpeak)) speakText(liveBuf);
  }
  if (s) { s.updatedAt = Date.now(); }
  saveState();
  streaming = false;
  liveBuf = '';
  const sendBtn = $id('bSend');
  sendBtn.textContent = '➤'; sendBtn.title = t('bubble.send'); sendBtn.classList.remove('stop');
  scrollMsgs(true); fitHeight();
}
function errTitle(info) {
  const st = info.status;
  if (st === 401 || st === 403) return '认证失败（' + st + '）';
  if (st === 429) return '请求过于频繁（429）';
  if (st === 404) return '接口或模型不存在（404）';
  if (st >= 500) return '服务端错误（' + st + '）';
  if (!st && /超时/.test(info.message || '')) return '请求超时';
  if (!st) return '网络失败';
  return '请求失败' + (st ? '（' + st + '）' : '');
}
tListen('chat-delta', ev => { if (ev.payload && typeof ev.payload.text === 'string') onDelta(ev.payload.text); });
tListen('chat-done', () => finishStream(true));
tListen('chat-stopped', () => { finishStream(true, null, null, { noSpeak: true }); pushSys('已停止生成', { ephemeral: true }); });
tListen('chat-error', ev => finishStream(false, ev.payload, null));
tListen('chat-notice', ev => {
  const msg = ev.payload && ev.payload.message;
  if (!msg) return;
  pushSys(msg, { ephemeral: true });
});
tListen('bubble-anchor', ev => {
  card.classList.toggle('below', !!(ev.payload && ev.payload.below));
});

/* ---- 工具调用（FR-TOOL-001/004）----
   tool-auth-request：首次调用前的授权卡片；chat-tool：执行结果；tool-pending：执行中。
   工具卡片是临时消息，不写入会话历史（上下文由主进程维护）。 */
function toolCard(html, cls) {
  const d = el('div', 'msg tool' + (cls ? ' ' + cls : ''));
  d.innerHTML = html;
  tempHost().appendChild(d);
  scrollMsgs(true); fitHeight();
  return d;
}
tListen('tool-pending', ev => {
  const p = ev.payload || {};
  const d = toolCard('<span class="tdots"><i></i><i></i><i></i></span>正在调用工具：' + esc(p.label || p.tool || ''));
  d.dataset.tool = p.tool || '';
  d.id = 'toolPend';
});
tListen('tool-auth-request', ev => {
  const p = ev.payload || {};
  const pend = $id('toolPend');
  if (pend) pend.remove();
  const d = toolCard(
    '<b>🔐 允许我使用「' + esc(p.label || p.tool) + '」吗？</b>' +
    '<div class="tool-desc">' + esc(p.description || '') +
    (p.egress === 'outbound' ? ' <span class="tool-net">会出站</span>' : ' <span class="tool-local">仅本地</span>') + '</div>' +
    (p.args ? '<div class="tool-args">' + esc(p.args) + '</div>' : '') +
    '<div class="m-act"><button data-ta="allow">本次允许</button><button data-ta="always">始终允许</button>' +
    '<button data-ta="deny">拒绝</button><button data-ta="never">始终拒绝</button></div>',
    'warn'
  );
  d.querySelectorAll('[data-ta]').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.ta;
      invoke('tool_auth_reply', { id: p.id, allow: k === 'allow' || k === 'always', remember: k === 'always' || k === 'never' })
        .catch(e => toast('授权失败：' + e, 'err'));
      const again = toolCard('<span class="tdots"><i></i><i></i><i></i></span>正在执行 ' + esc(p.label || ''), '');
      again.id = 'toolPend';
      d.remove();
      fitHeight();
    };
  });
  bMsgs.scrollTop = bMsgs.scrollHeight;
});
tListen('chat-tool', ev => {
  const p = ev.payload || {};
  const pend = $id('toolPend');
  if (pend) pend.remove();
  toolCard((p.ok ? '🛠 ' : '⚠️ ') + esc(p.label || p.tool || '工具') + '：' + esc(p.summary || ''), p.ok ? 'ok' : 'warn');
});

/* ---- 输入 ---- */
function autoGrow() {
  bInput.style.height = 'auto';
  bInput.style.height = Math.min(86, bInput.scrollHeight) + 'px';
  fitHeight();
}
bInput.addEventListener('input', autoGrow);
bInput.addEventListener('focus', () => { openedByReminder = false; });
bInput.addEventListener('keydown', e => {
  const enterSend = S ? S.settings.enterSend !== false : true;
  if (e.key === 'Enter') {
    if (enterSend && !e.shiftKey && !e.ctrlKey && !e.isComposing) { e.preventDefault(); doSend(); }
    else if (!enterSend && e.ctrlKey) { e.preventDefault(); doSend(); }
  }
});
function doSend() {
  const t = bInput.value.trim();
  if (!t || streaming) return;
  openedByReminder = false;
  bInput.value = ''; autoGrow();
  send(t);
}
$id('bSend').addEventListener('click', () => {
  if (streaming) invoke('chat_stop');
  else doSend();
});

/* ---- 气泡宽度拖拽（FR-BUB-003） ---- */
let resizeState = null;
document.querySelectorAll('.b-resize').forEach(h => {
  h.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    resizeState = {
      side: h.dataset.side,
      startX: e.screenX,
      startW: document.documentElement.clientWidth,
      lastW: document.documentElement.clientWidth,
      raf: 0,
    };
    h.classList.add('drag');
  });
});
document.addEventListener('mousemove', e => {
  if (!resizeState) return;
  const dx = e.screenX - resizeState.startX;
  let w = resizeState.startW + (resizeState.side === 'right' ? dx : -dx);
  w = Math.max(240, Math.min(480, w));
  resizeState.lastW = w;
  if (resizeState.raf) cancelAnimationFrame(resizeState.raf);
  resizeState.raf = requestAnimationFrame(() => {
    invoke('bubble_set_width', { width: w, side: resizeState.side, finalize: false }).catch(() => { });
  });
});
document.addEventListener('mouseup', () => {
  if (!resizeState) return;
  const side = resizeState.side;
  const w = resizeState.lastW;
  resizeState = null;
  document.querySelectorAll('.b-resize').forEach(x => x.classList.remove('drag'));
  invoke('bubble_set_width', { width: w, side, finalize: true }).catch(() => { });
});

/* ---- 显示 / 关闭 ---- */
function touchBubbleAct() { lastBubbleAct = Date.now(); }
['mousemove', 'mousedown', 'keydown', 'input', 'wheel', 'touchstart'].forEach(ev =>
  card.addEventListener(ev, touchBubbleAct, { passive: true }));
async function onShown(reason, auto) {
  await loadState();
  // 只有「后端自动弹出的提醒」才在确认后自动收起；用户原本就开着气泡则保持不动
  openedByReminder = reason === 'reminder' && auto !== false;
  // 应用持久化的气泡宽度（FR-BUB-003）
  try { await invoke('bubble_set_width', { width: S.settings.bubbleW || 340, side: 'center', finalize: true }); } catch (e) { }
  if (reason === 'click' && S.settings.newSessionPerClick && curSession() && curSession().msgs.length) {
    newSession();
  } else if (!curSession()) {
    newSession();
  }
  renderHead();
  renderSessionMsgs();
  // 主动提醒不抢焦点（FR-BUB-006 / NFR-INT-001）
  if (reason !== 'reminder') bInput.focus();
  touchBubbleAct();
  // 处理排队通知（提醒）
  try {
    const notices = await invoke('take_pending_notices');
    (notices || []).forEach(renderNotice);
  } catch (e) { }
}
/* FR-REM-002：提醒播报音。皮肤包提供提醒音效时优先使用，否则用内置合成音；
   总开关为「宠物与交互 → 提醒声音」。 */
let audioCtx = null;
function playReminderSound() {
  if (!S || (S.settings.reminderSound === false)) return;
  try {
    const pack = S.settings.skinPack;
    const src = pack && pack.sounds ? (pack.sounds.reminder || Object.values(pack.sounds)[0]) : '';
    if (src) { const a = new Audio(src); a.volume = 0.7; a.play().catch(() => { }); return; }
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [880, 1174].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.18 + 0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + i * 0.18); o.stop(t0 + i * 0.18 + 0.18);
    });
  } catch (e) { /* 无声环境不影响提醒本身 */ }
}
function renderNotice(n) {
  if (n.kind === 'reminder' && n.reminder) {
    const r = n.reminder;
    playReminderSound();
    pushSys('⏰ 叮！提醒：' + r.content + '（' + remRuleText(r) + '）', {
      ephemeral: true,
      reminder: true,
      actions: [
        { label: '稍后 5 分钟', dismiss: true, closeBubble: true, onClick: () => { invoke('reminder_snooze', { id: r.id, content: r.content }); pushSys('已稍后提醒：' + fmtDT(Date.now() + 5 * 60000), { ephemeral: true }); } },
        { label: '知道了', dismiss: true, closeBubble: true, onClick: () => { } },
      ],
    });
  }
}
tListen('bubble-shown', ev => {
  const reason = ev.payload && ev.payload.reason;
  const auto = ev.payload ? ev.payload.auto !== false : true;
  card.classList.toggle('below', !!(ev.payload && ev.payload.below));
  onShown(reason || 'click', auto);
});
tListen('new-session-req', async () => {
  await loadState();
  newSession();
  bInput.focus();
});
/* FR-REM-007：用户在宠物旁点击剪贴板提示后，读取一次剪贴板并作为待处理内容填入输入框。
   内容只在本地进入输入框，是否发送由用户决定。 */
tListen('clipboard-process-req', async () => {
  try {
    const r = await invoke('clipboard_read');
    const text = (r && r.text) || '';
    if (!text) { toast('剪贴板里没有文本', 'warn'); return; }
    bInput.value = '帮我处理下面这段内容（可以翻译、总结或纠错，视内容而定）：\n\n' + text;
    autoGrow();
    bInput.focus();
  } catch (e) { toast('读取剪贴板失败：' + e, 'err'); }
});
tListen('confirm-reset', async () => {
  if (confirm('确定重置全部数据吗？\n将清除：全部会话与消息、长期记忆、提醒、供应商配置（含密钥）、人格、宠物位置与所有设置。\n该操作不可撤销。')) {
    invoke('reset_data');
    toast('已重置全部数据', 'ok');
  }
});
tListen('lang-changed', async ev => {
  await loadState();
  applyI18n();
});
tListen('state-changed', async ev => {
  if (ev.payload && ev.payload.origin === 'bubble') return;
  await loadState();
  applyI18n();
  if (!streaming) { renderHead(); }
});
tListen('state-reset', async () => {
  await loadState();
  newSession();
  renderHead();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !streaming) { stopSpeak(); invoke('hide_bubble_cmd'); }
});
// Tauri v2 窗口 API 使用 onFocusChanged（onBlur 不存在，调用会抛 TypeError）
curWin.onFocusChanged(ev => {
  if (ev.payload) return; // 获得焦点时无需处理
  if (!streaming) { stopSpeak(); invoke('hide_bubble_cmd'); }
  else touchBubbleAct();
});
setInterval(() => {
  if (!S) return;
  const idle = (S.settings.bubbleIdleClose || 60) * 1000;
  if (Date.now() - lastBubbleAct > idle && !streaming) { stopSpeak(); invoke('hide_bubble_cmd'); }
}, 1000);

/* ---- 启动（窗口隐藏时保持轻量，显示时按 bubble-shown 渲染） ---- */
(async function init() {
  await loadState();
  applyI18n();

  renderHead();
})();
</script>
